<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GCG 上位卡组</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>GCG 上位卡组</h1>
      <p class="subtitle">日本 / 中国 / 欧美 · 非官方聚合</p>
    </div>
  </header>

  <main class="container">
    <p class="scope-note" role="note">
      只收录锦标赛、NT（新人类挑战赛）、编号卡挑战赛，以及人数≥50 的民间赛事的冠军与亚军卡组。
    </p>

    <nav class="region-tabs" role="tablist" aria-label="地区">
      <button type="button" class="tab active" data-region="all" role="tab" aria-selected="true">全部</button>
      <button type="button" class="tab" data-region="中国" role="tab" aria-selected="false">中国</button>
      <button type="button" class="tab" data-region="日本" role="tab" aria-selected="false">日本</button>
      <button type="button" class="tab" data-region="欧美" role="tab" aria-selected="false">欧美</button>
    </nav>

    <p id="china-note" class="china-note hidden" role="note">
      中国区公开信息较少，完整赛果与卡组请以「万代卡牌」App 内查询为准。
    </p>

    <section class="filters" aria-label="筛选">
      <label class="filter">
        <span>月份</span>
        <select id="month-filter">
          <option value="">全部月份</option>
        </select>
      </label>
      <label class="filter">
        <span>赛事类型</span>
        <select id="type-filter">
          <option value="">全部类型</option>
          <option value="NTC">NTC</option>
          <option value="SERIAL">编号卡</option>
          <option value="TOURNAMENT">锦标赛</option>
          <option value="CS">民间CS</option>
        </select>
      </label>
      <div class="filter filter-deck-type">
        <span>卡组类型</span>
        <div id="deck-type-filter" class="deck-type-chips" role="group" aria-label="卡组类型"></div>
      </div>
    </section>

    <div id="status" class="status" aria-live="polite">加载中…</div>
    <div id="empty-state" class="empty-state hidden"></div>
    <div id="event-list" class="event-list"></div>

    <nav id="pagination" class="pagination hidden" aria-label="分页"></nav>
  </main>

  <footer class="site-footer">
    <p>收录范围：锦标赛 / NT / 编号卡 / ≥50 人民间赛的冠亚卡组。非官方站点 · 卡图版权归万代等权利方。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
